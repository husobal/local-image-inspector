<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Local Image Inspector</title>
<style>
:root{
  --bg:#0d1117;--sidebar:#10151c;--surface:#161b22;--surface2:#1c222b;
  --border:#2b3440;--text:#f0f3f6;--muted:#8b98a5;--accent:#6ca8ff;
  --accent-soft:rgba(108,168,255,.14);--sidebar-width:265px;color-scheme:dark
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{
  overflow:hidden;background:var(--bg);color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
button,input,select{font:inherit;outline:none}
button{cursor:pointer}
.app{display:grid;grid-template-columns:var(--sidebar-width) minmax(0,1fr);height:100vh;width:100%}

/* Sidebar */
.sidebar{
  height:100vh;min-width:0;display:flex;flex-direction:column;background:var(--sidebar);
  border-right:1px solid var(--border);overflow:hidden
}
.sidebar-top{padding:14px 12px 10px;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand-icon{
  width:27px;height:27px;flex:0 0 27px;display:grid;place-items:center;border-radius:7px;
  background:var(--accent);color:#07111d;font-weight:800;font-size:13px
}
.brand-title{font-weight:700;font-size:14px;line-height:1.2}
.brand-subtitle{margin-top:2px;font-size:10px;color:var(--muted)}
.folder-button{
  display:flex;align-items:center;justify-content:center;width:100%;min-height:34px;margin-top:12px;
  padding:6px 10px;border:1px solid var(--border);border-radius:7px;background:var(--surface);
  color:var(--text);font-size:12px;font-weight:650;user-select:none;cursor:pointer
}
.folder-button:hover{border-color:#465362;background:var(--surface2)}
#folderInput{display:none}
.sidebar-section-title{
  display:flex;align-items:center;justify-content:space-between;gap:8px;height:35px;padding:0 11px;
  border-bottom:1px solid var(--border);color:var(--muted);font-size:10px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase
}
.folder-count{font-size:10px;font-weight:600;letter-spacing:0;text-transform:none}
.tree-wrap{flex:1;min-height:0;overflow:auto;padding:6px 4px 12px}
.tree-wrap::-webkit-scrollbar,.main-scroll::-webkit-scrollbar{width:9px;height:9px}
.tree-wrap::-webkit-scrollbar-thumb,.main-scroll::-webkit-scrollbar-thumb{
  background:#303945;border-radius:10px;border:2px solid transparent;background-clip:padding-box
}
.tree{font-size:12px}
.tree ul{list-style:none;margin:0;padding-left:14px}
.tree>ul{padding-left:0}
.tree-item{
  display:flex;align-items:center;gap:5px;height:27px;min-width:0;padding:0 6px;border-radius:5px;
  cursor:pointer;user-select:none
}
.tree-item:hover{background:rgba(255,255,255,.04)}
.tree-item.active{background:var(--accent-soft);color:#ddebff}
.tree-arrow{width:12px;flex:0 0 12px;text-align:center;color:#758392;font-size:9px}
.tree-icon{width:13px;flex:0 0 13px;opacity:.8}
.tree-name{min-width:0;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tree-number{flex:0 0 auto;margin-left:auto;color:#758392;font-size:10px}
.sidebar-footer{
  padding:8px 11px;border-top:1px solid var(--border);color:var(--muted);font-size:10px;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis
}

/* Main */
.main{min-width:0;height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.toolbar{
  flex:0 0 auto;min-height:53px;padding:8px 14px;border-bottom:1px solid var(--border);
  background:rgba(13,17,23,.96);display:flex;align-items:center;gap:8px
}
.mobile-tree-button{display:none}
.search{position:relative;flex:1 1 280px;max-width:420px;min-width:120px}
.search input{
  width:100%;height:34px;padding:5px 10px 5px 31px;border:1px solid var(--border);border-radius:7px;
  background:var(--surface);color:var(--text);font-size:12px
}
.search input:focus{border-color:#587395}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:12px;pointer-events:none}
.compact-control{
  height:34px;min-width:0;padding:4px 9px;border:1px solid var(--border);border-radius:7px;
  background:var(--surface);color:var(--text);font-size:11px
}
.compact-button{
  height:34px;padding:4px 10px;border:1px solid var(--border);border-radius:7px;
  background:var(--surface);color:var(--text);font-size:11px;white-space:nowrap
}
.compact-button:hover{background:var(--surface2)}
.compact-button.active{border-color:#476d9e;background:var(--accent-soft);color:#dceaff}
.toolbar-info{margin-left:auto;color:var(--muted);font-size:11px;white-space:nowrap}

/* Filters */
.filter-panel{flex:0 0 auto;display:none;padding:9px 14px 11px;border-bottom:1px solid var(--border);background:#11161d}
.filter-panel.open{display:block}
.filter-grid{
  display:grid;grid-template-columns:repeat(4,minmax(115px,1fr)) minmax(180px,1.4fr) auto;
  gap:8px;align-items:end
}
.filter-field{min-width:0}
.filter-field label{
  display:block;margin:0 0 4px 1px;color:var(--muted);font-size:9px;font-weight:700;
  text-transform:uppercase;letter-spacing:.04em
}
.filter-field select,.filter-field input{
  width:100%;height:31px;padding:4px 7px;border:1px solid var(--border);border-radius:6px;
  background:var(--surface);color:var(--text);font-size:10px
}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.reset-button{
  height:31px;padding:4px 10px;border:1px solid var(--border);border-radius:6px;
  background:transparent;color:var(--muted);font-size:10px
}
.reset-button:hover{color:var(--text);background:var(--surface)}

/* Status */
.statusbar{
  flex:0 0 auto;height:35px;display:flex;align-items:center;gap:16px;padding:0 14px;
  border-bottom:1px solid var(--border);color:var(--muted);font-size:10px;background:#0e1319
}
.statusbar strong{color:var(--text)}
.status-path{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.scan-status{margin-left:auto;white-space:nowrap}

/* Grid */
.main-scroll{flex:1;min-height:0;overflow:auto;padding:12px;contain:strict}
.empty{
  display:flex;align-items:center;justify-content:center;min-height:180px;border:1px dashed var(--border);
  border-radius:9px;color:var(--muted);font-size:12px;text-align:center;padding:20px
}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:10px}
.card{
  min-width:0;overflow:hidden;border:1px solid var(--border);border-radius:9px;background:var(--surface);
  transition:border-color .12s ease,transform .12s ease;content-visibility:auto;
  contain-intrinsic-size:260px 330px
}
.card:hover{border-color:#465463;transform:translateY(-1px)}
.thumb-wrap{
  position:relative;aspect-ratio:4/3;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#090d12
}
.thumb{display:block;width:100%;height:100%;object-fit:contain}
.thumb-placeholder{
  width:100%;height:100%;display:grid;place-items:center;color:#53606d;font-size:10px
}
.format-badge{
  position:absolute;top:6px;right:6px;padding:3px 5px;border-radius:5px;border:1px solid rgba(255,255,255,.12);
  background:rgba(0,0,0,.68);color:#fff;font-size:9px;font-weight:700;line-height:1
}
.card-body{padding:8px 9px 9px}
.file-name{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:11px;font-weight:700}
.file-path{margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--muted);font-size:9px}
.meta{
  display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:8px;padding-top:7px;
  border-top:1px solid rgba(255,255,255,.06)
}
.meta-item{min-width:0}
.meta-label{color:#73808e;font-size:8px;text-transform:uppercase;letter-spacing:.03em}
.meta-value{margin-top:1px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#dce1e6;font-size:9px}
.load-note{
  grid-column:1/-1;text-align:center;color:var(--muted);font-size:10px;padding:8px 0 2px
}
.sidebar-overlay{display:none}

/* Responsive */
@media(max-width:1100px){.filter-grid{grid-template-columns:repeat(3,minmax(120px,1fr))}}
@media(max-width:820px){
  .app{display:block}
  .sidebar{
    position:fixed;z-index:50;top:0;left:0;width:min(290px,86vw);transform:translateX(-100%);
    transition:transform .18s ease;box-shadow:18px 0 40px rgba(0,0,0,.35)
  }
  .sidebar.mobile-open{transform:translateX(0)}
  .sidebar-overlay{
    display:block;position:fixed;z-index:40;inset:0;background:rgba(0,0,0,.48);opacity:0;
    pointer-events:none;transition:opacity .18s ease
  }
  .sidebar-overlay.open{opacity:1;pointer-events:auto}
  .main{width:100%}
  .mobile-tree-button{display:inline-flex;align-items:center;justify-content:center;order:0}
  .toolbar{padding:7px 9px;flex-wrap:wrap}
  .search{order:1;max-width:none;flex:1 1 calc(100% - 42px)}
  #sortBy{order:2;flex:1 1 160px}
  #filtersButton{order:3}
  .toolbar-info{display:none}
  .filter-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .statusbar{padding:0 9px}
  .scan-status{display:none}
  .main-scroll{padding:9px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
}
@media(max-width:500px){
  .filter-grid{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .meta{grid-template-columns:1fr}
  .statusbar{gap:9px}
  .hide-small{display:none}
}
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <div class="brand-icon">LI</div>
        <div>
          <div class="brand-title">Local Image Inspector</div>
          <div class="brand-subtitle">One file. No uploads.</div>
        </div>
      </div>

      <label class="folder-button" for="folderInput">Open Folder</label>
      <input id="folderInput" type="file" webkitdirectory multiple accept="image/*">
    </div>

    <div class="sidebar-section-title">
      <span>Explorer</span>
      <span class="folder-count" id="folderCount">0 folders</span>
    </div>

    <div class="tree-wrap">
      <div class="tree" id="treeRoot">
        <div class="empty">Open a folder to browse images.</div>
      </div>
    </div>

    <div class="sidebar-footer" id="rootFolderName">No folder selected</div>
  </aside>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <main class="main">
    <div class="toolbar">
      <button class="compact-button mobile-tree-button" id="mobileTreeButton">☰</button>

      <div class="search">
        <span class="search-icon">⌕</span>
        <input id="searchInput" type="search" placeholder="Search images...">
      </div>

      <select id="sortBy" class="compact-control" title="Sort">
        <option value="resolution-desc">Resolution ↓</option>
        <option value="resolution-asc" selected>Resolution ↑</option>
        <option value="size-desc">File size ↓</option>
        <option value="size-asc">File size ↑</option>
        <option value="width-desc">Width ↓</option>
        <option value="width-asc">Width ↑</option>
        <option value="height-desc">Height ↓</option>
        <option value="height-asc">Height ↑</option>
        <option value="megapixels-desc">Megapixels ↓</option>
        <option value="megapixels-asc">Megapixels ↑</option>
        <option value="name-asc">Name A–Z</option>
        <option value="name-desc">Name Z–A</option>
        <option value="date-desc">Newest</option>
        <option value="date-asc">Oldest</option>
      </select>

      <button id="filtersButton" class="compact-button">Filters</button>
      <div class="toolbar-info"><span id="toolbarCount">0 images</span></div>
    </div>

    <div class="filter-panel" id="filterPanel">
      <div class="filter-grid">
        <div class="filter-field">
          <label>Format</label>
          <select id="formatFilter"><option value="">All formats</option></select>
        </div>

        <div class="filter-field">
          <label>Orientation</label>
          <select id="orientationFilter">
            <option value="">All orientations</option>
            <option value="landscape">Landscape</option>
            <option value="portrait">Portrait</option>
            <option value="square">Square</option>
          </select>
        </div>

        <div class="filter-field">
          <label>Aspect ratio</label>
          <select id="ratioFilter">
            <option value="">All ratios</option>
            <option value="1:1">1:1</option>
            <option value="4:5">4:5</option>
            <option value="3:4">3:4</option>
            <option value="3:2">3:2</option>
            <option value="2:3">2:3</option>
            <option value="16:9">16:9</option>
            <option value="9:16">9:16</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="filter-field">
          <label>Exact dimensions</label>
          <div class="pair">
            <input id="exactWidth" type="number" min="0" placeholder="Width">
            <input id="exactHeight" type="number" min="0" placeholder="Height">
          </div>
        </div>

        <div class="filter-field">
          <label>Width range</label>
          <div class="pair">
            <input id="minWidth" type="number" min="0" placeholder="Min">
            <input id="maxWidth" type="number" min="0" placeholder="Max">
          </div>
        </div>

        <div class="filter-field">
          <label>Height range</label>
          <div class="pair">
            <input id="minHeight" type="number" min="0" placeholder="Min">
            <input id="maxHeight" type="number" min="0" placeholder="Max">
          </div>
        </div>

        <div class="filter-field">
          <label>File size KB</label>
          <div class="pair">
            <input id="minSize" type="number" min="0" placeholder="Min">
            <input id="maxSize" type="number" min="0" placeholder="Max">
          </div>
        </div>

        <button class="reset-button" id="clearFiltersBtn">Reset</button>
      </div>
    </div>

    <div class="statusbar">
      <span><strong id="shownCount">0</strong> shown</span>
      <span class="hide-small"><strong id="totalCount">0</strong> total</span>
      <span class="status-path"><strong id="currentFolderLabel">All files</strong></span>
      <span class="scan-status" id="scanStatus">Ready</span>
    </div>

    <div class="main-scroll" id="mainScroll">
      <div id="gridRoot">
        <div class="empty">Open a folder to inspect images.</div>
      </div>
    </div>
  </main>
</div>

<script>
const BATCH_SIZE = 60;

const state = {
  images: [],
  tree: null,
  selectedFolderPath: "",
  rootName: "",
  collapsed: new Set(),
  renderedCount: 0,
  currentFiltered: [],
  thumbObserver: null,
  activeThumbUrls: new Set(),
  thumbQueue: [],
  thumbWorkers: 0,
  thumbGeneration: 0,
  thumbCache: new Map(),
  loadingMore: false,
  scrollTicking: false
};

const imageExtensions = new Set([
  "jpg","jpeg","png","webp","gif","bmp","avif","svg","tif","tiff"
]);

const $ = id => document.getElementById(id);

const els = {
  folderInput:$("folderInput"),
  treeRoot:$("treeRoot"),
  folderCount:$("folderCount"),
  rootFolderName:$("rootFolderName"),
  searchInput:$("searchInput"),
  sortBy:$("sortBy"),
  filtersButton:$("filtersButton"),
  filterPanel:$("filterPanel"),
  formatFilter:$("formatFilter"),
  orientationFilter:$("orientationFilter"),
  ratioFilter:$("ratioFilter"),
  exactWidth:$("exactWidth"),
  exactHeight:$("exactHeight"),
  minWidth:$("minWidth"),
  maxWidth:$("maxWidth"),
  minHeight:$("minHeight"),
  maxHeight:$("maxHeight"),
  minSize:$("minSize"),
  maxSize:$("maxSize"),
  clearFiltersBtn:$("clearFiltersBtn"),
  shownCount:$("shownCount"),
  totalCount:$("totalCount"),
  currentFolderLabel:$("currentFolderLabel"),
  scanStatus:$("scanStatus"),
  toolbarCount:$("toolbarCount"),
  gridRoot:$("gridRoot"),
  mainScroll:$("mainScroll"),
  sidebar:$("sidebar"),
  mobileTreeButton:$("mobileTreeButton"),
  sidebarOverlay:$("sidebarOverlay")
};

function escapeHtml(value=""){
  return value.replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function formatBytes(bytes){
  if(!bytes) return "0 B";
  const units=["B","KB","MB","GB"];
  let value=bytes,index=0;
  while(value>=1024 && index<units.length-1){value/=1024;index++}
  const decimals=value>=100?0:value>=10?1:2;
  return value.toFixed(decimals)+" "+units[index];
}

function formatDate(timestamp){
  if(!timestamp) return "—";
  return new Date(timestamp).toLocaleDateString();
}

function gcd(a,b){
  while(b){const t=b;b=a%b;a=t}
  return a||1;
}

function ratioText(width,height){
  if(!width||!height) return "—";
  const d=gcd(width,height);
  return Math.round(width/d)+":"+Math.round(height/d);
}

function ratioBucket(width,height){
  if(!width||!height) return "other";
  const ratio=width/height;
  const known=[
    ["1:1",1],["4:5",4/5],["3:4",3/4],["3:2",3/2],
    ["2:3",2/3],["16:9",16/9],["9:16",9/16]
  ];
  for(const [label,value] of known){
    if(Math.abs(ratio-value)<=0.025) return label;
  }
  return "other";
}

function orientation(width,height){
  if(width===height) return "square";
  return width>height?"landscape":"portrait";
}

function isImage(file){
  const ext=file.name.split(".").pop()?.toLowerCase();
  return file.type.startsWith("image/") || imageExtensions.has(ext);
}

function cleanupThumbObservers(){
  if(state.thumbObserver){
    state.thumbObserver.disconnect();
    state.thumbObserver=null;
  }
}

function cleanupActiveThumbUrls(){
  for(const url of state.activeThumbUrls){
    try{URL.revokeObjectURL(url)}catch{}
  }
  state.activeThumbUrls.clear();
}

function cleanupThumbnailQueue(){
  state.thumbGeneration++;
  state.thumbQueue.length=0;
}

function clearThumbnailCache(){
  state.thumbCache.clear();
}

function cleanupRenderedResources(){
  cleanupThumbObservers();
  cleanupActiveThumbUrls();
  cleanupThumbnailQueue();
}

function readU24LE(view,offset){
  return view.getUint8(offset) |
    (view.getUint8(offset+1)<<8) |
    (view.getUint8(offset+2)<<16);
}

async function readJpegDimensions(file){
  // SOF is usually near the start. Read progressively without decoding the photo.
  const limits=[64*1024,256*1024,1024*1024];

  for(const limit of limits){
    const buffer=await file.slice(0,Math.min(file.size,limit)).arrayBuffer();
    const view=new DataView(buffer);

    if(view.byteLength<4 || view.getUint16(0,false)!==0xFFD8) return null;

    let offset=2;
    while(offset+9<view.byteLength){
      if(view.getUint8(offset)!==0xFF){
        offset++;
        continue;
      }

      let marker=view.getUint8(offset+1);
      while(marker===0xFF && offset+2<view.byteLength){
        offset++;
        marker=view.getUint8(offset+1);
      }

      if(marker===0xD8 || marker===0xD9){
        offset+=2;
        continue;
      }

      if(marker===0xDA) break; // Start of scan.

      if(offset+4>view.byteLength) break;
      const length=view.getUint16(offset+2,false);
      if(length<2) break;

      const isSof=
        (marker>=0xC0 && marker<=0xC3) ||
        (marker>=0xC5 && marker<=0xC7) ||
        (marker>=0xC9 && marker<=0xCB) ||
        (marker>=0xCD && marker<=0xCF);

      if(isSof && offset+9<view.byteLength){
        return {
          height:view.getUint16(offset+5,false),
          width:view.getUint16(offset+7,false)
        };
      }

      offset+=2+length;
    }

    if(limit>=file.size) break;
  }

  return null;
}

async function readHeaderDimensions(file){
  const ext=file.name.split(".").pop()?.toLowerCase() || "";

  try{
    if(ext==="jpg" || ext==="jpeg"){
      return await readJpegDimensions(file);
    }

    if(ext==="png"){
      const view=new DataView(await file.slice(0,24).arrayBuffer());
      if(
        view.byteLength>=24 &&
        view.getUint32(0,false)===0x89504E47 &&
        view.getUint32(4,false)===0x0D0A1A0A
      ){
        return {
          width:view.getUint32(16,false),
          height:view.getUint32(20,false)
        };
      }
    }

    if(ext==="gif"){
      const view=new DataView(await file.slice(0,10).arrayBuffer());
      if(view.byteLength>=10){
        return {
          width:view.getUint16(6,true),
          height:view.getUint16(8,true)
        };
      }
    }

    if(ext==="bmp"){
      const view=new DataView(await file.slice(0,26).arrayBuffer());
      if(view.byteLength>=26){
        return {
          width:Math.abs(view.getInt32(18,true)),
          height:Math.abs(view.getInt32(22,true))
        };
      }
    }

    if(ext==="webp"){
      const view=new DataView(await file.slice(0,32).arrayBuffer());
      if(
        view.byteLength>=30 &&
        view.getUint32(0,false)===0x52494646 &&
        view.getUint32(8,false)===0x57454250
      ){
        const chunk=view.getUint32(12,false);

        // VP8X
        if(chunk===0x56503858 && view.byteLength>=30){
          return {
            width:1+readU24LE(view,24),
            height:1+readU24LE(view,27)
          };
        }

        // VP8L
        if(chunk===0x5650384C && view.byteLength>=25 && view.getUint8(20)===0x2F){
          const b1=view.getUint8(21);
          const b2=view.getUint8(22);
          const b3=view.getUint8(23);
          const b4=view.getUint8(24);
          return {
            width:1+(((b2&0x3F)<<8)|b1),
            height:1+(((b4&0x0F)<<10)|(b3<<2)|((b2&0xC0)>>6))
          };
        }

        // Lossy VP8
        if(chunk===0x56503820 && view.byteLength>=30){
          return {
            width:view.getUint16(26,true)&0x3FFF,
            height:view.getUint16(28,true)&0x3FFF
          };
        }
      }
    }

    if(ext==="avif"){
      // Most AVIF files expose an ispe box near the start.
      const buffer=await file.slice(0,Math.min(file.size,1024*1024)).arrayBuffer();
      const bytes=new Uint8Array(buffer);
      const view=new DataView(buffer);

      for(let i=4;i+16<bytes.length;i++){
        if(
          bytes[i]===0x69 && bytes[i+1]===0x73 &&
          bytes[i+2]===0x70 && bytes[i+3]===0x65
        ){
          const width=view.getUint32(i+8,false);
          const height=view.getUint32(i+12,false);
          if(width && height) return {width,height};
        }
      }
    }

    if(ext==="svg"){
      const text=await file.slice(0,64*1024).text();
      const viewBox=text.match(/viewBox\s*=\s*["']\s*[-\d.]+\s+[-\d.]+\s+([\d.]+)\s+([\d.]+)\s*["']/i);
      if(viewBox){
        return {
          width:Math.round(Number(viewBox[1])),
          height:Math.round(Number(viewBox[2]))
        };
      }

      const width=text.match(/\bwidth\s*=\s*["']([\d.]+)(?:px)?["']/i);
      const height=text.match(/\bheight\s*=\s*["']([\d.]+)(?:px)?["']/i);
      if(width && height){
        return {
          width:Math.round(Number(width[1])),
          height:Math.round(Number(height[1]))
        };
      }
    }
  }catch{}

  return null;
}

function decodeDimensions(file){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();

    const finish=(ok,width=0,height=0)=>{
      try{URL.revokeObjectURL(url)}catch{}
      ok?resolve({width,height}):reject(new Error("Unreadable image"));
    };

    img.onload=()=>finish(true,img.naturalWidth||img.width||0,img.naturalHeight||img.height||0);
    img.onerror=()=>finish(false);
    img.decoding="async";
    img.src=url;
  });
}

async function readDimensions(file){
  const header=await readHeaderDimensions(file);
  if(header?.width && header?.height) return header;
  return decodeDimensions(file);
}

async function scanFiles(fileList){
  cleanupRenderedResources();
  clearThumbnailCache();

  const files=Array.from(fileList).filter(isImage);
  state.images=[];
  state.tree=null;
  state.selectedFolderPath="";
  state.renderedCount=0;

  if(!files.length){
    els.scanStatus.textContent="No images found";
    els.rootFolderName.textContent="No folder selected";
    renderAll();
    return;
  }

  const root=(files[0].webkitRelativePath||files[0].name).split("/")[0];
  state.rootName=root;
  els.rootFolderName.textContent=root;
  els.scanStatus.textContent=`Scanning 0 / ${files.length}`;

  for(let i=0;i<files.length;i++){
    const file=files[i];

    try{
      const {width,height}=await readDimensions(file);
      const fullPath=file.webkitRelativePath||file.name;
      const parts=fullPath.split("/");
      const relativeParts=parts.slice(1);
      const name=relativeParts.at(-1)||file.name;
      const folderPath=relativeParts.slice(0,-1).join("/");
      const ext=name.split(".").pop().toLowerCase();
      const pixels=width*height;

      state.images.push({
        file,
        id:state.images.length,
        name,
        nameLower:name.toLowerCase(),
        relativePath:relativeParts.join("/"),
        folderPath,
        ext,
        width,
        height,
        size:file.size,
        lastModified:file.lastModified,
        pixels,
        megapixels:pixels/1000000,
        orientation:orientation(width,height),
        ratio:ratioText(width,height),
        ratioBucket:ratioBucket(width,height)
      });
    }catch{
      console.warn("Could not read:",file.name);
    }

    if((i+1)%8===0 || i===files.length-1){
      els.scanStatus.textContent=`Scanning ${i+1} / ${files.length}`;
      await new Promise(resolve=>setTimeout(resolve,0));
    }
  }

  state.tree=buildTree(state.images,root);
  refreshFormatFilter();
  renderAll();
  els.scanStatus.textContent=`Loaded ${state.images.length} images`;
}

function buildTree(images,rootName){
  const root={name:rootName,path:"",count:images.length,children:new Map()};

  for(const image of images){
    if(!image.folderPath) continue;
    const parts=image.folderPath.split("/");
    let node=root,current="";

    for(const part of parts){
      current=current?current+"/"+part:part;

      if(!node.children.has(part)){
        node.children.set(part,{name:part,path:current,count:0,children:new Map()});
      }

      node=node.children.get(part);
      node.count++;
    }
  }

  return root;
}

function countFolders(node){
  if(!node) return 0;
  let total=1;
  for(const child of node.children.values()) total+=countFolders(child);
  return total;
}

function renderTree(){
  if(!state.tree){
    els.treeRoot.innerHTML='<div class="empty">Open a folder to browse images.</div>';
    els.folderCount.textContent="0 folders";
    return;
  }

  els.folderCount.textContent=(countFolders(state.tree)-1)+" folders";

  function nodeHtml(node){
    const active=state.selectedFolderPath===node.path;
    const collapsed=state.collapsed.has(node.path);
    const hasChildren=node.children.size>0;

    const children=(hasChildren&&!collapsed)
      ? `<ul>${Array.from(node.children.values())
          .sort((a,b)=>a.name.localeCompare(b.name))
          .map(nodeHtml).join("")}</ul>`
      : "";

    return `
      <li>
        <div class="tree-item ${active?"active":""}" data-path="${escapeHtml(node.path)}">
          <span class="tree-arrow" data-toggle="${escapeHtml(node.path)}">${hasChildren?(collapsed?"▶":"▼"):""}</span>
          <span class="tree-icon">${hasChildren?"▣":"□"}</span>
          <span class="tree-name" title="${escapeHtml(node.name)}">${escapeHtml(node.name)}</span>
          <span class="tree-number">${node.count}</span>
        </div>
        ${children}
      </li>`;
  }

  els.treeRoot.innerHTML=`<ul>${nodeHtml(state.tree)}</ul>`;

  els.treeRoot.querySelectorAll(".tree-item").forEach(item=>{
    item.addEventListener("click",event=>{
      const path=item.dataset.path||"";
      const toggle=event.target.closest("[data-toggle]");

      if(toggle){
        if(state.collapsed.has(path)) state.collapsed.delete(path);
        else state.collapsed.add(path);
        renderTree();
        return;
      }

      state.selectedFolderPath=path;
      resetVisibleWindow();
      renderTree();
      renderGrid();
      closeMobileSidebar();
    });
  });
}

function refreshFormatFilter(){
  const current=els.formatFilter.value;
  const formats=[...new Set(state.images.map(image=>image.ext))].sort();

  els.formatFilter.innerHTML=
    '<option value="">All formats</option>'+
    formats.map(format=>`<option value="${format}">${format.toUpperCase()}</option>`).join("");

  if(formats.includes(current)) els.formatFilter.value=current;
}

function filteredImages(){
  let images=state.images.slice();
  const folder=state.selectedFolderPath;

  if(folder){
    images=images.filter(image=>
      image.folderPath===folder || image.folderPath.startsWith(folder+"/")
    );
  }

  const search=els.searchInput.value.trim().toLowerCase();
  const format=els.formatFilter.value;
  const orient=els.orientationFilter.value;
  const ratio=els.ratioFilter.value;
  const exactWidth=Number(els.exactWidth.value);
  const exactHeight=Number(els.exactHeight.value);
  const minWidth=Number(els.minWidth.value);
  const maxWidth=Number(els.maxWidth.value);
  const minHeight=Number(els.minHeight.value);
  const maxHeight=Number(els.maxHeight.value);
  const minSize=Number(els.minSize.value)*1024;
  const maxSize=Number(els.maxSize.value)*1024;

  images=images.filter(image=>{
    if(search&&!image.nameLower.includes(search)) return false;
    if(format&&image.ext!==format) return false;
    if(orient&&image.orientation!==orient) return false;
    if(ratio&&image.ratioBucket!==ratio) return false;
    if(exactWidth&&image.width!==exactWidth) return false;
    if(exactHeight&&image.height!==exactHeight) return false;
    if(minWidth&&image.width<minWidth) return false;
    if(maxWidth&&image.width>maxWidth) return false;
    if(minHeight&&image.height<minHeight) return false;
    if(maxHeight&&image.height>maxHeight) return false;
    if(minSize&&image.size<minSize) return false;
    if(maxSize&&image.size>maxSize) return false;
    return true;
  });

  switch(els.sortBy.value){
    case "resolution-desc":images.sort((a,b)=>b.pixels-a.pixels);break;
    case "resolution-asc":images.sort((a,b)=>a.pixels-b.pixels);break;
    case "size-desc":images.sort((a,b)=>b.size-a.size);break;
    case "size-asc":images.sort((a,b)=>a.size-b.size);break;
    case "width-desc":images.sort((a,b)=>b.width-a.width);break;
    case "width-asc":images.sort((a,b)=>a.width-b.width);break;
    case "height-desc":images.sort((a,b)=>b.height-a.height);break;
    case "height-asc":images.sort((a,b)=>a.height-b.height);break;
    case "megapixels-desc":images.sort((a,b)=>b.megapixels-a.megapixels);break;
    case "megapixels-asc":images.sort((a,b)=>a.megapixels-b.megapixels);break;
    case "name-asc":images.sort((a,b)=>a.name.localeCompare(b.name));break;
    case "name-desc":images.sort((a,b)=>b.name.localeCompare(a.name));break;
    case "date-desc":images.sort((a,b)=>b.lastModified-a.lastModified);break;
    case "date-asc":images.sort((a,b)=>a.lastModified-b.lastModified);break;
  }

  return images;
}

function resetVisibleWindow(){
  cleanupRenderedResources();
  state.renderedCount=0;
  state.currentFiltered=[];
  state.loadingMore=false;
  els.mainScroll.scrollTop=0;
}

function waitForBrowserIdle(){
  return new Promise(resolve=>{
    if("requestIdleCallback" in window){
      requestIdleCallback(()=>resolve(),{timeout:120});
    }else{
      setTimeout(resolve,24);
    }
  });
}

async function makeThumbnailBlob(image){
  const cached=state.thumbCache.get(image.id);
  if(cached) return cached;

  const maxSide=640;
  const scale=Math.min(1,maxSide/Math.max(image.width,image.height));
  const targetWidth=Math.max(1,Math.round(image.width*scale));
  const targetHeight=Math.max(1,Math.round(image.height*scale));

  let bitmap=null;

  try{
    if("createImageBitmap" in window){
      try{
        bitmap=await createImageBitmap(image.file,{
          resizeWidth:targetWidth,
          resizeHeight:targetHeight,
          resizeQuality:"high"
        });
      }catch{
        bitmap=await createImageBitmap(image.file);
      }

      const canvas=document.createElement("canvas");
      canvas.width=targetWidth;
      canvas.height=targetHeight;

      const ctx=canvas.getContext("2d",{alpha:false});
      ctx.imageSmoothingEnabled=true;
      ctx.imageSmoothingQuality="high";
      ctx.drawImage(bitmap,0,0,targetWidth,targetHeight);

      if(bitmap.close) bitmap.close();
      bitmap=null;

      const blob=await new Promise(resolve=>{
        canvas.toBlob(resolve,"image/jpeg",0.85);
      });

      if(blob){
        state.thumbCache.set(image.id,blob);
      }

      canvas.width=1;
      canvas.height=1;

      return blob;
    }
  }catch{
    if(bitmap?.close) bitmap.close();
  }

  // Fallback for browsers where createImageBitmap is unavailable or fails.
  const blob=await new Promise((resolve,reject)=>{
    const sourceUrl=URL.createObjectURL(image.file);
    const source=new Image();

    const cleanup=()=>{
      try{URL.revokeObjectURL(sourceUrl)}catch{}
      source.src="";
    };

    source.onload=()=>{
      try{
        const canvas=document.createElement("canvas");
        canvas.width=targetWidth;
        canvas.height=targetHeight;

        const ctx=canvas.getContext("2d",{alpha:false});
        ctx.imageSmoothingEnabled=true;
        ctx.imageSmoothingQuality="high";
        ctx.drawImage(source,0,0,targetWidth,targetHeight);

        canvas.toBlob(result=>{
          cleanup();
          canvas.width=1;
          canvas.height=1;

          if(result) resolve(result);
          else reject(new Error("Thumbnail failed"));
        },"image/jpeg",0.85);
      }catch(error){
        cleanup();
        reject(error);
      }
    };

    source.onerror=()=>{
      cleanup();
      reject(new Error("Thumbnail failed"));
    };

    source.decoding="async";
    source.src=sourceUrl;
  });

  if(blob){
    state.thumbCache.set(image.id,blob);
  }

  return blob;
}

function showThumbnailBlob(img,blob){
  if(!blob || !img.isConnected) return;

  const url=URL.createObjectURL(blob);
  state.activeThumbUrls.add(url);

  const release=()=>{
    if(state.activeThumbUrls.has(url)){
      try{URL.revokeObjectURL(url)}catch{}
      state.activeThumbUrls.delete(url);
    }
  };

  img.addEventListener("load",release,{once:true});
  img.addEventListener("error",release,{once:true});
  img.src=url;
}

function pumpThumbnailQueue(){
  // One high-resolution source is decoded at a time.
  if(state.thumbWorkers>=1 || !state.thumbQueue.length) return;

  const task=state.thumbQueue.shift();
  state.thumbWorkers=1;

  (async()=>{
    try{
      if(task.generation!==state.thumbGeneration || !task.img.isConnected) return;

      const cached=state.thumbCache.get(task.image.id);

      if(cached){
        showThumbnailBlob(task.img,cached);
        return;
      }

      // Let Safari paint/scroll/respond before starting another 4K+ decode.
      await waitForBrowserIdle();

      if(task.generation!==state.thumbGeneration || !task.img.isConnected) return;

      const blob=await makeThumbnailBlob(task.image);

      if(task.generation!==state.thumbGeneration || !task.img.isConnected) return;

      showThumbnailBlob(task.img,blob);
    }catch{
      // Keep the card visible even if an individual thumbnail cannot be generated.
    }finally{
      state.thumbWorkers=0;

      // Yield once more before taking the next large image from the queue.
      await waitForBrowserIdle();
      pumpThumbnailQueue();
    }
  })();
}

function queueThumbnail(img,image){
  if(img.dataset.queued==="1") return;

  img.dataset.queued="1";
  const generation=state.thumbGeneration;

  const cached=state.thumbCache.get(image.id);
  if(cached){
    showThumbnailBlob(img,cached);
    return;
  }

  state.thumbQueue.push({img,image,generation});
  pumpThumbnailQueue();
}

function ensureThumbObserver(){
  if(state.thumbObserver) return state.thumbObserver;

  state.thumbObserver=new IntersectionObserver(entries=>{
    for(const entry of entries){
      if(!entry.isIntersecting) continue;

      const img=entry.target;
      state.thumbObserver.unobserve(img);

      const id=Number(img.dataset.imageId);
      const image=state.images[id];
      if(!image || img.dataset.queued==="1") continue;

      queueThumbnail(img,image);
    }
  },{
    root:els.mainScroll,
    rootMargin:"220px 0px",
    threshold:0.01
  });

  return state.thumbObserver;
}

function observeNewThumbs(container){
  const observer=ensureThumbObserver();
  container.querySelectorAll('img[data-image-id]:not([data-observed="1"])').forEach(img=>{
    img.dataset.observed="1";
    observer.observe(img);
  });
}

function cardHtml(image){
  return `
    <article class="card">
      <div class="thumb-wrap">
        <img class="thumb" data-image-id="${image.id}" alt="" decoding="async">
        <span class="format-badge">${escapeHtml(image.ext.toUpperCase())}</span>
      </div>

      <div class="card-body">
        <div class="file-name" title="${escapeHtml(image.name)}">${escapeHtml(image.name)}</div>
        <div class="file-path" title="${escapeHtml(image.relativePath)}">${escapeHtml(image.relativePath)}</div>

        <div class="meta">
          <div class="meta-item"><div class="meta-label">Resolution</div><div class="meta-value">${image.width} × ${image.height}</div></div>
          <div class="meta-item"><div class="meta-label">Size</div><div class="meta-value">${formatBytes(image.size)}</div></div>
          <div class="meta-item"><div class="meta-label">Ratio</div><div class="meta-value">${image.ratio}</div></div>
          <div class="meta-item"><div class="meta-label">Megapixels</div><div class="meta-value">${image.megapixels.toFixed(2)} MP</div></div>
          <div class="meta-item"><div class="meta-label">Orientation</div><div class="meta-value">${image.orientation}</div></div>
          <div class="meta-item"><div class="meta-label">Modified</div><div class="meta-value">${formatDate(image.lastModified)}</div></div>
        </div>
      </div>
    </article>`;
}

function updateLoadNote(){
  const note=$("loadNote");
  if(!note) return;

  const total=state.currentFiltered.length;
  const shown=Math.min(state.renderedCount,total);
  note.textContent=shown<total?`Showing ${shown} of ${total}`:`Showing all ${total}`;
  note.style.display=shown<total?"block":"none";
}

function appendNextBatch(){
  if(state.loadingMore) return;

  const grid=$("imageGrid");
  if(!grid) return;

  const total=state.currentFiltered.length;
  if(state.renderedCount>=total) return;

  state.loadingMore=true;

  const start=state.renderedCount;
  const end=Math.min(start+BATCH_SIZE,total);
  const batch=state.currentFiltered.slice(start,end);

  const holder=document.createElement("div");
  holder.innerHTML=batch.map(cardHtml).join("");

  const fragment=document.createDocumentFragment();
  while(holder.firstChild) fragment.appendChild(holder.firstChild);
  grid.appendChild(fragment);

  state.renderedCount=end;
  observeNewThumbs(grid);
  updateLoadNote();
  state.loadingMore=false;
}

function maybeAppendOnScroll(){
  if(state.loadingMore) return;
  if(state.renderedCount>=state.currentFiltered.length) return;

  const remaining=els.mainScroll.scrollHeight-els.mainScroll.scrollTop-els.mainScroll.clientHeight;
  if(remaining<700) appendNextBatch();
}

function renderGrid(){
  cleanupRenderedResources();
  state.renderedCount=0;
  state.loadingMore=false;

  const images=filteredImages();
  state.currentFiltered=images;

  els.shownCount.textContent=images.length;
  els.totalCount.textContent=state.images.length;
  els.toolbarCount.textContent=images.length+" images";
  els.currentFolderLabel.textContent=state.selectedFolderPath||"All files";

  if(!state.images.length){
    els.gridRoot.innerHTML='<div class="empty">Open a folder to inspect images.</div>';
    return;
  }

  if(!images.length){
    els.gridRoot.innerHTML='<div class="empty">No images match the current filters.</div>';
    return;
  }

  els.gridRoot.innerHTML=`
    <div class="grid" id="imageGrid"></div>
    <div class="load-note" id="loadNote"></div>
  `;

  appendNextBatch();
}

function renderAll(){
  renderTree();
  renderGrid();
}

function resetFilters(){
  els.searchInput.value="";
  els.formatFilter.value="";
  els.orientationFilter.value="";
  els.ratioFilter.value="";
  els.exactWidth.value="";
  els.exactHeight.value="";
  els.minWidth.value="";
  els.maxWidth.value="";
  els.minHeight.value="";
  els.maxHeight.value="";
  els.minSize.value="";
  els.maxSize.value="";
  els.sortBy.value="resolution-asc";
  resetVisibleWindow();
  renderGrid();
}

function filterOrSortChanged(){
  resetVisibleWindow();
  renderGrid();
}

function openMobileSidebar(){
  els.sidebar.classList.add("mobile-open");
  els.sidebarOverlay.classList.add("open");
}

function closeMobileSidebar(){
  els.sidebar.classList.remove("mobile-open");
  els.sidebarOverlay.classList.remove("open");
}

els.folderInput.addEventListener("change",async event=>{
  if(!event.target.files.length) return;
  await scanFiles(event.target.files);
});

els.filtersButton.addEventListener("click",()=>{
  els.filterPanel.classList.toggle("open");
  els.filtersButton.classList.toggle("active");
});

els.clearFiltersBtn.addEventListener("click",resetFilters);
els.mobileTreeButton.addEventListener("click",openMobileSidebar);
els.sidebarOverlay.addEventListener("click",closeMobileSidebar);

[
  els.searchInput,els.exactWidth,els.exactHeight,els.minWidth,els.maxWidth,
  els.minHeight,els.maxHeight,els.minSize,els.maxSize
].forEach(element=>element.addEventListener("input",filterOrSortChanged));

[
  els.sortBy,els.formatFilter,els.orientationFilter,els.ratioFilter
].forEach(element=>element.addEventListener("change",filterOrSortChanged));

els.mainScroll.addEventListener("scroll",()=>{
  if(state.scrollTicking) return;
  state.scrollTicking=true;
  requestAnimationFrame(()=>{
    maybeAppendOnScroll();
    state.scrollTicking=false;
  });
},{passive:true});

window.addEventListener("beforeunload",cleanupRenderedResources);
</script>
</body>
</html>
